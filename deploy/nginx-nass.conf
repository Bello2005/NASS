# Proxy inverso de NASS Ciudadano.
# install.sh sustituye __DOMINIO__ y __PUERTO__; certbot añade después el TLS.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # El ciudadano adjunta evidencia y la unidad reporta posición.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__PUERTO__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";
        # El limitador de peticiones lee esta cabecera (src/server/http.ts).
        # Sin ella todo el tráfico contaría como una sola IP.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # El canal de eventos en tiempo real es una conexión larga: sin esto
        # nginx la almacena en búfer y el centro de despacho deja de recibir.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
